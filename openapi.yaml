  /billing/webhooks/stripe:
    post:
      tags: [Billing Accounts]
      summary: Handle Stripe webhook
      description: Public endpoint. Rate limited. Verifies the Stripe signature against the raw request body and processes supported Stripe events.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
          description: Stripe webhook signature header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              id: evt_1P0000000000000000000000
              object: event
              type: checkout.session.completed
              data:
                object:
                  id: cs_test_0000000000000000000000
                  object: checkout.session
      responses:
        "200":
          description: Event accepted, already processed, or skipped.
        "400":
          description: Failed to read body or invalid webhook signature.
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Failed to process webhook event.
          content:
            text/plain:
              schema:
                type: string

