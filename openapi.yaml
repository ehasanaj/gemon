  /billing-account/{id}/plan/{plan_id}:
    post:
      tags: [Billing Accounts]
      summary: Set billing account plan
      description: Requires user role. Free plans are applied immediately. Paid plans create a pending entitlement change and return a Stripe checkout URL.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Billing account ID
          schema:
            type: string
        - name: plan_id
          in: path
          required: true
          description: Plan ID
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOrResultResponse"
              examples:
                paid_plan:
                  summary: Paid plan requires checkout
                  value:
                    plan:
                      id: 64b2f6b76f9c2a9f2d4f4d12
                      name: Starter
                      description: Starter plan
                      is_free: false
                      is_published: true
                      internal: false
                      is_trial_eligible: true
                      trial_days: 14
                      is_configurator_template: false
                      resources:
                        - resource:
                            id: 64b2f6b76f9c2a9f2d4f4d11
                            name: Translation keys
                            Type: translation_keys
                            step: 1000
                            is_published: true
                          amount: 5
                          BillingPeriod: monthly
                          stripe_product:
                            product_id: prod_123
                            item_id: price_123
                            monthly_price_id: price_123
                            annual_price_id: price_123
                      base_fee:
                        Value: 1000
                        Currencty: EUR
                      discount_yearly: 10
                      discount_monthly: 0
                      billing_period: monthly
                      stripe_product:
                        product_id: prod_123
                        item_id: price_123
                        monthly_price_id: price_123
                        annual_price_id: price_123
                    needs_checkout: true
                    checkout_url: https://checkout.stripe.com/c/session_123
                free_plan:
                  summary: Free plan applied immediately
                  value:
                    plan:
                      id: 64b2f6b76f9c2a9f2d4f4d13
                      name: Free
                      description: Free plan
                      is_free: true
                      is_published: true
                      internal: false
                      is_trial_eligible: false
                      trial_days: 0
                      is_configurator_template: false
                      resources: []
                      base_fee:
                        Value: 0
                        Currencty: EUR
                      discount_yearly: 0
                      discount_monthly: 0
                      billing_period: monthly
                    needs_checkout: false
                    checkout_url: ""
        "400":
          description: Invalid billing account ID or missing Stripe product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Billing account, plan, or authenticated user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Pending entitlement change already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing-account/{id}/addons:
    post:
      tags: [Billing Accounts]
      summary: Set billing account addons
      description: Requires user role. Creates a pending addon entitlement change and returns a Stripe checkout URL.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Billing account ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/ResourceEmbedd"
            example:
              - resource:
                  id: 64b2f6b76f9c2a9f2d4f4d11
                  name: Translation keys
                  Type: translation_keys
                  price:
                    Value: 1000
                    Currencty: EUR
                  step: 1000
                  is_published: true
                amount: 2
                BillingPeriod: monthly
                stripe_product:
                  product_id: prod_456
                  item_id: price_456
                  monthly_price_id: price_456
                  annual_price_id: price_456
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOrResultResponse"
              example:
                resources:
                  - resource:
                      id: 64b2f6b76f9c2a9f2d4f4d11
                      name: Translation keys
                      Type: translation_keys
                      price:
                        Value: 1000
                        Currencty: EUR
                      step: 1000
                      is_published: true
                    amount: 2
                    BillingPeriod: monthly
                    stripe_product:
                      product_id: prod_456
                      item_id: price_456
                      monthly_price_id: price_456
                      annual_price_id: price_456
                needs_checkout: true
                checkout_url: https://checkout.stripe.com/c/session_123
        "400":
          description: Invalid billing account ID, invalid JSON, or empty resources array
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Billing account or authenticated user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Pending entitlement change already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Billing Accounts]
      summary: Remove billing account addons
      description: Requires user role. Creates a pending addon removal entitlement change and returns a Stripe checkout URL.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
