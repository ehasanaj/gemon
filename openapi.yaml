  /sdk/translations/manifest:
    get:
      tags: [SDK]
      summary: Get SDK manifest
      description: |
        Rate limited to 60 requests per minute per IP. Requires `X-OTA-Publish-Id`.
        Migration: replaces `GET /sdk/projects/{projectId}/translations/...` + `X-API-Key`.
      security:
        - OTAPublishIdAuth: []
      parameters:
        - name: X-OTA-Publish-Id
          in: header
          required: true
          schema:
            type: string
          example: ota_publish_live_01j9q4m4f6q6phx9tx2awzv2vp
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: Optional ETag for conditional requests.
        - name: platform
          in: query
          schema:
            type: string
            default: flutter
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: ETag for conditional requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestResponse"
              example:
                version: 12
                locales:
                  en:
                    version: 8
                    url: "https://api.rerune.com/api/sdk/translations/flutter/en"
                  de:
                    version: 6
                    url: "https://api.rerune.com/api/sdk/translations/flutter/de"
        "304":
          description: Not Modified
          headers:
            ETag:
              schema:
                type: string
              description: ETag for the current manifest.
        "401":
          description: Unauthorized (missing, invalid, or expired OTA publish ID)
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: SDK quota exceeded
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds until another request is allowed.
          content:
            text/plain:
              schema:
                type: string

  /sdk/translations/{platform}/{locale}:
    get:
      tags: [SDK]
      summary: Get SDK locale file
      description: Rate limited to 60 requests per minute per IP. Requires `X-OTA-Publish-Id`.
      security:
        - OTAPublishIdAuth: []
      parameters:
        - name: X-OTA-Publish-Id
          in: header
          required: true
          schema:
            type: string
          example: ota_publish_live_01j9q4m4f6q6phx9tx2awzv2vp
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: Optional ETag for conditional requests.
        - name: platform
          in: path
          required: true
          schema:
            type: string
        - name: locale
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema:
                type: string
              description: ETag for conditional requests.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        "304":
          description: Not Modified
          headers:
            ETag:
              schema:
                type: string
              description: ETag for the current locale file.
        "401":
          description: Unauthorized (missing, invalid, or expired OTA publish ID)
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: SDK quota exceeded
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: string
              description: Seconds until another request is allowed.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    OTAPublishIdAuth:
      type: apiKey
      in: header
      name: X-OTA-Publish-Id
      description: OTA publish ID used by SDK routes.
  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        first_name:
          type: string
        last_name:
          type: string

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        user_id:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    VerifyEmailRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string

    RequestResetPayload:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    CompleteResetPayload:
      type: object
      required: [request_id, token, new_password]
      properties:
        request_id:
          type: string
        token:
          type: string
        new_password:
