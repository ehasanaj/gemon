openapi: 3.0.3
info:
  title: Rerune Server API
  version: "1.0.0"
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Password Reset
  - name: Newsletter
  - name: Organisation
  - name: Project
  - name: Project Preferences
  - name: Translation
  - name: Profile
  - name: Dictionary
  - name: Metadata
  - name: CLI
  - name: Codec
  - name: Integrations
  - name: Billing Accounts
  - name: Resources
  - name: Plans
  - name: DeepL
  - name: OpenRouter
  - name: AI Settings
  - name: Statistics
  - name: SDK

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      tags: [Auth]
      summary: Register
      description: Rate limited. `selected_plan_id` is read from the query string.
      parameters:
        - name: selected_plan_id
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      description: Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/{id}/verify-email:
    put:
      tags: [Auth]
      summary: Verify email
      description: Rate limited.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOrResultResponse"
        "400":
          description: Invalid verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /forgot-password/:
    post:
      tags: [Password Reset]
      summary: Request password reset
      description: Rate limited. Returns 202 even if the email does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestResetPayload"
      responses:
        "202":
          description: Accepted
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /forgot-password/reset:
    post:
      tags: [Password Reset]
      summary: Complete password reset
      description: Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteResetPayload"
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid reset token or payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/:
    post:
      tags: [Newsletter]
      summary: Subscribe email to newsletter
      description: Accepts a JSON body for privacy-safe submissions. Query parameter support remains for backwards compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscribeRequest"
      responses:
        "200":
          description: OK
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organisation/:
    post:
      tags: [Organisation]
      summary: Create organisation
      description: Requires user role. Caller must be an active owner of the provided billing account. Creation allocates an organisation resource and returns `409` when capacity is exhausted.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganisationRequest"
            example:
              name: Engineering
              billing_account_id: 64b2f6b76f9c2a9f2d4f4d10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an active owner of the billing account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Capacity exhausted or active assignment conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MongoDB transactions are unavailable in the current environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Organisation]
      summary: List organisations
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organisation"

  /organisation/{id}:
    get:
      tags: [Organisation]
      summary: Get organisation by ID
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
    put:
      tags: [Organisation]
      summary: Update organisation
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Organisation"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
    delete:
      tags: [Organisation]
      summary: Delete organisation
      description: Deletes an organisation and releases its active organisation assignment. Returns `409` when the organisation still has projects.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "409":
          description: Organisation still has projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the organisation owner can delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organisation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MongoDB transactions are unavailable in the current environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organisation/{id}/invite:
    post:
      tags: [Organisation]
      summary: Invite user to organisation
      description: Requires owner/member access. Invite reserves or reuses a seat from the organisation billing account and returns `409` when seat capacity is exhausted.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: OK
        "400":
          description: Invalid invitation request (including inviting the owner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not authorised to invite users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organisation or invited user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Seat capacity exhausted, duplicate pending invite, or organisation billing account not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MongoDB transactions are unavailable in the current environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organisation/{id}/accept-invitation/{user_id}/code/{invitation_code}:
    post:
      tags: [Organisation]
      summary: Accept organisation invitation
      description: Accepts invitation only when an active seat assignment exists for the same billing account.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: invitation_code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: Invalid invitation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated user does not match invitation target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organisation or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Active seat assignment is required or organisation billing account is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organisation/{id}/remove-user:
    delete:
      tags: [Organisation]
      summary: Remove user from organisation
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /project/:
    post:
      tags: [Project]
      summary: Create project
      description: Requires user role and membership/ownership in the target organisation. Billing account is derived from organisation.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              organisation_id: "65f1f77bcf86cd7994390222"
              name: Mobile App
              notes: Release train project
              description: Main mobile localization project
              guidelines: Keep tone friendly and concise.
              type: organisation
              languages:
                - code: en
                  name: English
                  main: true
                  version: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: "65f1f77bcf86cd7994390111"
                organisation_id: "65f1f77bcf86cd7994390222"
                name: Mobile App
                notes: Release train project
                description: Main mobile localization project
                guidelines: Keep tone friendly and concise.
                type: organisation
                owner:
                  id: user-1
                  first_name: Ada
                  last_name: Lovelace
                  email: ada@example.com
                users:
                  - id: user-1
                    first_name: Ada
                    last_name: Lovelace
                    email: ada@example.com
                languages:
                  - code: en
                    name: English
                    main: true
                    version: 1
                ota_published_ids: []
                version: 1
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not authorised for the target organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organisation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Organisation billing account is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /project/organisation/{organisation_id}:
    get:
      tags: [Project]
      summary: List projects by organisation
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: organisation_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
              example:
                - id: "65f1f77bcf86cd7994390111"
                  organisation_id: "65f1f77bcf86cd7994390222"
                  name: Mobile App
                  notes: Release train project
                  description: Main mobile localization project
                  guidelines: Keep tone friendly and concise.
                  type: organisation
                  owner:
                    id: user-1
                    first_name: Ada
                    last_name: Lovelace
                    email: ada@example.com
                  users:
                    - id: user-1
                      first_name: Ada
                      last_name: Lovelace
                      email: ada@example.com
                  languages:
                    - code: en
                      name: English
                      main: true
                      version: 8
                    - code: de
                      name: German
                      main: false
                      version: 6
                  ota_published_ids:
                    - id: "65f1f77bcf86cd7994390aa"
                      value: "****"
                      expires_at: "2026-12-31T23:59:59Z"
                    - id: "65f1f77bcf86cd7994390ab"
                      value: "****"
                  version: 12

  /project/{id}:
    get:
      tags: [Project]
      summary: Get project by ID
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: "65f1f77bcf86cd7994390111"
                organisation_id: "65f1f77bcf86cd7994390222"
                name: Mobile App
                notes: Updated release notes
                description: Main mobile localization project
                guidelines: Keep tone friendly and concise.
                type: organisation
                owner:
                  id: user-1
                  first_name: Ada
                  last_name: Lovelace
                  email: ada@example.com
                users:
                  - id: user-1
                    first_name: Ada
                    last_name: Lovelace
                    email: ada@example.com
                languages:
                  - code: en
                    name: English
                    main: true
                    version: 9
                  - code: de
                    name: German
                    main: false
                    version: 7
                ota_published_ids:
                  - id: "65f1f77bcf86cd7994390aa"
                    value: "****"
                    expires_at: "2026-12-31T23:59:59Z"
                version: 13
    put:
      tags: [Project]
      summary: Update project
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: "65f1f77bcf86cd7994390111"
                organisation_id: "65f1f77bcf86cd7994390222"
                name: Mobile App
                notes: Updated release notes
                description: Main mobile localization project
                guidelines: Keep tone friendly and concise.
                type: organisation
                owner:
                  id: user-1
                  first_name: Ada
                  last_name: Lovelace
                  email: ada@example.com
                users:
                  - id: user-1
                    first_name: Ada
                    last_name: Lovelace
                    email: ada@example.com
                languages:
                  - code: en
                    name: English
                    main: true
                    version: 9
                  - code: de
                    name: German
                    main: false
                    version: 7
                ota_published_ids:
                  - id: "65f1f77bcf86cd7994390aa"
                    value: "****"
                    expires_at: "2026-12-31T23:59:59Z"
                version: 13
    delete:
      tags: [Project]
      summary: Delete project
      description: Deletes project and releases active project assignment.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "409":
          description: Active assignment conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /project/{id}/ota-published-id:
    post:
      tags: [Project]
      summary: Create OTA publish ID for project
      description: Returns the generated OTA publish ID value once at creation time.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOTAPublishedIDRequest"
            examples:
              nonExpiring:
                summary: Create non-expiring OTA key
                value: {}
              withExpiry:
                summary: Create OTA key with expiry
                value:
                  expires_at: "2026-12-31T23:59:59Z"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOTAPublishedIDResponse"
              example:
                id: "65f1f77bcf86cd7994390aa"
                value: "ota_publish_live_01j9q4m4f6q6phx9tx2awzv2vp"
                expires_at: "2026-12-31T23:59:59Z"
        "400":
          description: Invalid project ID or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: invalid project ID
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: project not found
        "409":
          description: OTA publish ID conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: OTA publish ID already exists
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /project/{id}/ota-published-id/{ota_id}:
    delete:
      tags: [Project]
      summary: Delete OTA publish ID for project
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: ota_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: Invalid project ID or OTA publish ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: invalid OTA publish ID
        "404":
          description: OTA publish ID not found for project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: OTA publish ID not found for this project
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /project/{id}/invite:
    post:
      tags: [Project]
      summary: Invite user to project
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: OK

  /project/{id}/accept-invitation/{user_id}:
    post:
      tags: [Project]
      summary: Accept project invitation
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK

  /project/{projectId}/preferences/me:
    get:
      tags: [Project Preferences]
      summary: Get my project preference
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUserPreference"

  /project/{projectId}/preferences/:
    post:
      tags: [Project Preferences]
      summary: Create project preference
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectPreferenceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUserPreference"
    put:
      tags: [Project Preferences]
      summary: Update project preference
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectPreferenceRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUserPreference"
    delete:
      tags: [Project Preferences]
      summary: Delete project preference
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
    get:
      tags: [Project Preferences]
      summary: List project preferences
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
