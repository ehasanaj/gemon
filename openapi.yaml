            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/ResourceEmbedd"
            example:
              - resource:
                  id: 64b2f6b76f9c2a9f2d4f4d11
                  name: Translation keys
                  Type: translation_keys
                  price:
                    Value: 1000
                    Currencty: EUR
                  step: 1000
                  is_published: true
                amount: 1
                BillingPeriod: monthly
                stripe_product:
                  product_id: prod_456
                  item_id: price_456
                  monthly_price_id: price_456
                  annual_price_id: price_456
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutOrResultResponse"
              example:
                resources:
                  - resource:
                      id: 64b2f6b76f9c2a9f2d4f4d11
                      name: Translation keys
                      Type: translation_keys
                      price:
                        Value: 1000
                        Currencty: EUR
                      step: 1000
                      is_published: true
                    amount: 1
                    BillingPeriod: monthly
                    stripe_product:
                      product_id: prod_456
                      item_id: price_456
                      monthly_price_id: price_456
                      annual_price_id: price_456
                needs_checkout: true
                checkout_url: https://checkout.stripe.com/c/session_123
        "400":
